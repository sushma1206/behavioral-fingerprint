<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Behavioral Fingerprint IDS - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=3">
</head>
<body class="cyber-body fade-in">
    <!-- Animated Matrix Background -->
    <canvas id="matrixCanvas" class="cyber-canvas"></canvas>
    <div class="cyber-grid"></div>

    <div class="cyber-wrapper">
        <div class="cyber-content">
            <!-- Security Monitoring Decorators -->
            <div class="cyber-decorators">
                <div class="cyber-badge pulse"><span class="dot red"></span> Threat Detection Active</div>
                <div class="cyber-badge pulse delay-1"><span class="dot blue"></span> AI Monitoring Enabled</div>
                <div class="cyber-badge pulse delay-2"><span class="dot cyan"></span> Zero Trust Security</div>
            </div>

        <!-- Glassmorphism Card -->
        <div class="cyber-card slide-up">
            <div class="cyber-header">
                <div class="shield-container pulse-slow">
                    <svg class="shield-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                        <path d="M12 8v4M12 16h.01"/>
                    </svg>
                </div>
                <h1 class="typing-text">Behavioral Fingerprint IDS</h1>
                <p class="cyber-subtitle">Adaptive Intrusion Detection System</p>
            </div>

            <form action="/login" method="POST" class="cyber-form">
                <div class="cyber-input-group">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <input type="text" id="username" name="username" class="cyber-input" placeholder=" " required>
                    <label for="username" class="floating-label">Username</label>
                    <div class="cyber-border-bottom"></div>
                </div>

                <div class="cyber-input-group">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <input type="password" id="password" name="password" class="cyber-input" placeholder=" " required>
                    <label for="password" class="floating-label">Password</label>
                    <div class="cyber-border-bottom"></div>
                    <button type="button" class="toggle-password" onclick="togglePassword()">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>

                <div class="cyber-actions">
                    <button type="submit" class="cyber-btn primary-neon ripple">Secure Login</button>
                    <a href="/register" class="cyber-btn outline-neon">Create Account</a>
                    </div>
    </div>
            </form>
            
            <div class="cyber-fingerprint-container">
                <svg viewBox="0 0 24 24" class="fingerprint-svg pulse-slow" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path d="M2 12C2 6.477 6.477 2 12 2s10 4.477 10 10M12 6a6 6 0 0 0-6 6M12 10a2 2 0 0 0-2 2M16 12a4 4 0 0 0-4-4" stroke-linecap="round"/>
                </svg>
            </div>
        </div>
    </div>

    <!-- Interactive JavaScript Animations -->
    <script>
        function togglePassword() {
            const pwd = document.getElementById('password');
            if (pwd.type === 'password') {
                pwd.type = 'text';
            } else {
                pwd.type = 'password';
            }
        }

        // Binary Matrix Rain
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const chars = '0101011001101'.split('');
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = [];
        for (let x = 0; x < columns; x++) drops[x] = Math.random() * -100;

        function draw() {
            ctx.fillStyle = 'rgba(5, 5, 10, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00f0ff'; // Neon Cyan
            ctx.font = fontSize + 'px monospace';
            
            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.98) drops[i] = 0;
                drops[i]++;
            }
        }
        setInterval(draw, 50);

        // Window resize handler
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Button Ripple Effect
        document.querySelectorAll('.ripple').forEach(button => {
            button.addEventListener('click', function(e) {
                let rect = button.getBoundingClientRect();
                let x = e.clientX - rect.left;
                let y = e.clientY - rect.top;
                let ripple = document.createElement('span');
                ripple.className = 'ripple-effect';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });
        });
    </script>
</body>
</html>
